# merge_font.toml
# Configuration for the font-merging pipeline.
#
# Top-level keys define the **common defaults** inherited by every family.
# Each [[families]] section may override any of these defaults.
# Subfamily-level settings live under [[families.subfamilies]].
#
# Supported types for chars lists:
#   "X"        – a single Unicode character (e.g. "…")
#   8230       – a decimal codepoint integer
#   [start, end] – an inclusive codepoint range (as an inline array)

# ---------------------------------------------------------------------------
# Common defaults (inherited by every family unless overridden)
# ---------------------------------------------------------------------------

author      = "Zhaosheng Pan"
description = ""

mark_as_monospace = true
remove_hints      = true
adjust_baseline   = true

# Characters/ranges to expand to double (fullwidth) advance width.
# strategy = "stretch"    — scale the outline horizontally
# strategy = "pad_left"   — pad with whitespace on the left  (glyph stays right)
# strategy = "center"     — pad with whitespace on both sides
# strategy = "pad_right"  — pad with whitespace on the right (glyph stays left)
[[double_width]]
chars    = ["\u2026", "\u2014"]   # … —
strategy = "stretch"

[[double_width]]
chars    = ["\u2018", "\u201c"]   # ‘ “
strategy = "pad_left"

[[double_width]]
chars    = ["\u2019", "\u201d"]   # ’ ”
strategy = "pad_right"

# Symbol font overlays applied to every subfamily.
symbol_fonts = [
    "~/Library/Fonts/SymbolsNerdFont-Regular.ttf",
    "FlogSymbols.ttf",
]


# ---------------------------------------------------------------------------
# Font families
# ---------------------------------------------------------------------------

# ── Monaspace Argon + LXGW Bright ────────────────────────────────────────

[[families]]
name = "Monaspace Argon LXGW NF"

[[families.subfamilies]]
