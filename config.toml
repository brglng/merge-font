western_font    = "~/Library/Fonts/MonaspaceArgon-Light.otf"
cjk_font        = "~/Library/Fonts/LXGWBright-Light.ttf"
western_scale_x = 0.9
cjk_scale       = 1.16

[[families.subfamilies]]
name            = "Light Italic"
western_font    = "~/Library/Fonts/MonaspaceArgon-LightItalic.otf"
