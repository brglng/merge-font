# merge_font.toml
# Configuration for the font-merging pipeline.
#
# Top-level keys define the **common defaults** inherited by every family.
# Each [families."<Name>"] section may override any of these defaults.
# Subfamily-level settings live under:
#   [families."<Name>".subfamilies."<SubfamilyName>"]
#
# Supported types for chars lists:
#   "X"        – a single Unicode character (e.g. "…")
#   8230       – a decimal codepoint integer
#   [start, end] – an inclusive codepoint range (as an inline array)

# ---------------------------------------------------------------------------
# Common defaults (inherited by every family unless overridden)
# ---------------------------------------------------------------------------

new_author      = "Zhaosheng Pan"
new_description = ""

mark_as_monospace = true
remove_hints      = true
adjust_baseline   = true

# Characters to stretch horizontally to full (double) width.
stretch_chars = ["\u2026", "\u2014"]   # … —

# Symbol font overlays applied to every subfamily.
symbol_font_paths = [
    "~/Library/Fonts/SymbolsNerdFont-Regular.ttf",
    "FlogSymbols.ttf",
]

# Per-character padding rules.  Defined as an array of tables so that the
# alignment direction is explicit for each group.
[[pad_configs]]
chars     = ["\u2018", "\u201c"]   # ' "
alignment = "right"

[[pad_configs]]
chars     = ["\u2019", "\u201d"]   # ' "
alignment = "left"


# ---------------------------------------------------------------------------
# Font families
# ---------------------------------------------------------------------------

# ── Monaspace Argon + LXGW Bright TC ────────────────────────────────────────

[families."Monaspace Argon LXGW Bright TC NF".subfamilies.Light]
